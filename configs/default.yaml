model:
  name: Qwen/Qwen2.5-1.5B
  dtype: float16        # weight storage; GTX 1650 has poor bf16 support
  compute_dtype: float32  # matmuls in fp32: fp16 GEMM is ~4.5x slower on GTX 1650
  device: cuda

eval:
  dataset: wikitext
  subset: wikitext-2-raw-v1
  split: test
  seq_len: 512          # short to fit in 4 GB VRAM
  max_samples: null     # null = full split; set an int for fast search-time eval

quant:
  bit_choices: [2, 3, 4, 8, 16]
  group_size: 128
  weight_only: true

seed: 42
